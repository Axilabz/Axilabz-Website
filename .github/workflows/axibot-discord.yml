name: AxiBot Discord updates

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: axibot-discord-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      id-token: write
    steps:
      - name: Notify Axilabz through AxiBot
        shell: bash
        env:
          AXIBOT_URL: https://axibot.selah-tpm.workers.dev/github/push
        run: |
          python3 - <<'PY'
          import json
          import re
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          endpoint = os.environ['AXIBOT_URL']
          identity_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          separator = '&' if '?' in identity_url else '?'
          identity_url += separator + urllib.parse.urlencode({'audience': endpoint})
          identity_request = urllib.request.Request(identity_url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'],
          })
          with urllib.request.urlopen(identity_request, timeout=20) as response:
              identity = json.load(response)['value']
          # GitHub masks identity tokens; also explicitly mask without printing them.
          print('::add-mask::' + identity)
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as source:
              event = json.load(source)
          commits = event.get('commits') or []
          if not commits and event.get('head_commit'):
              commits = [event['head_commit']]
          count = max(len(commits), int(event.get('size') or 0))
          payload = {
              'ref': event['ref'],
              'before': event.get('before', ''),
              'after': event['after'],
              'deleted': bool(event.get('deleted', False)),
              'commit_count': count,
              'commits': [
                  {'id': commit['id'], 'message': commit.get('message', '')[:500]}
                  for commit in commits[-5:]
              ],
          }
          request = urllib.request.Request(endpoint, method='POST',
              data=json.dumps(payload).encode('utf-8'), headers={
                  'Authorization': 'Bearer ' + identity,
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'AxiBot-GitHub-Notifications/1.0 (+https://github.com/JohnSathya1999/axilabz-website)',
              })
          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              print('AxiBot notification failed: HTTP ' + str(error.code))
              failure = error.read(1024).decode('utf-8', errors='replace')
              try:
                  reason = json.loads(failure).get('error', 'unknown_error')
                  if re.fullmatch(r'[a-z_]{1,80}', str(reason)):
                      print('Receiver reason: ' + reason)
              except (ValueError, AttributeError):
                  match = re.search(r'error code: (\d+)', failure)
                  print('Hosting rejection: ' + (match.group(1) if match else 'non-JSON response'))
              print('No automatic retry: check delivery status before rerunning this job.')
              sys.exit(1)
          except (TimeoutError, urllib.error.URLError):
              print('AxiBot delivery is uncertain; check Discord before rerunning this job.')
              sys.exit(1)
          print('AxiBot result: ' + str(result.get('status', 'unknown')))
          if result.get('url'):
              print('Discord message: ' + result['url'])
          PY
